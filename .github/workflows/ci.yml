name: CI
on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: 'string'
      jdk:
        default: 8
        type: 'string'
      os:
        default: ubuntu-latest
        type: 'string'
      profile:
        default: ''
        type: 'string'
      container:
        default: ''
        type: 'string'
jobs:
  Test:
    name: Run tests
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    container: ${{ inputs.container || null }}
    steps:
      - name: Install container dependencies
        if: ${{ inputs.container != '' }}
        run: |
          apt-get update && apt-get install -y git maven openssl libssl-dev libapr1t64
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.jdk }}
          distribution: temurin
      - name: Run tests
        if: ${{ runner.os != 'Linux' || inputs.container != ''  }}
        run: mvn -s .github/maven-ci-settings.xml -q clean verify -B -Pcheckstyle "-Dsurefire.timeout=3000" ${{ inputs.profile }}
      - name: Run tests
        if: ${{ runner.os == 'Linux' && inputs.container == '' }}
        run: |
          # io_uring testing requires more locked memory for kernel ring buffers than the default 8MB limit
          sudo prlimit --pid $$ --memlock=16777216:16777216
          mvn -s .github/maven-ci-settings.xml -q clean verify -B -Pcheckstyle "-Dsurefire.timeout=3000" ${{ inputs.profile }}
      - name: Print thread dumps of timed out tests
        if: ${{ failure() }}
        shell: bash
        run: |
          # surefire writes a thread dump of a fork it kills after -Dsurefire.timeout
          find . -path '*/surefire-reports/*.dump' | while read -r f; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
